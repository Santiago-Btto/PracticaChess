name: Generar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Seleccionar Java 17 para Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Java y dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools virtualenv
          python3 -m pip install "buildozer==1.5.0" "cython==0.29.34"

      - name: Preparar SDK y aceptar licencias Android
        working-directory: mobile
        run: |
          buildozer android debug || true
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDK_MANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses

      - name: Compilar APK de depuración
        working-directory: mobile
        run: buildozer -v android debug

      - name: Conservar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: PracticaChess-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
